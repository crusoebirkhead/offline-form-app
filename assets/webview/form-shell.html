<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Form</title>
  <link rel="stylesheet" href="assets/formio.form.min.css" />
  <!-- flatpickr (datetime/calendar) styles, bundled locally for offline use.
       Form.io would otherwise fetch this from cdn.form.io at runtime. -->
  <link rel="stylesheet" href="assets/flatpickr.min.css" />
  <link rel="stylesheet" href="formio-theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.5;
      color: #32383f;
      background: #fff;
      -webkit-text-size-adjust: 100%;
    }

    #formio-container {
      min-height: 100px;
    }

    #formio-container:empty::after {
      content: "Loading form\2026";
      display: block;
      padding: 24px;
      text-align: center;
      color: #888;
    }

  </style>
</head>
<body>
  <div id="formio-container"></div>

  <!-- Preload flatpickr so window.flatpickr exists before any datetime field
       initializes. Form.io's requireLibrary('flatpickr', 'flatpickr', ...)
       short-circuits when the global is already present, so it never reaches
       out to cdn.form.io — keeping datetime fields working fully offline. -->
  <script src="assets/flatpickr.min.js"></script>
  <script src="assets/formio.form.min.js"></script>
  <script src="assets/formio-standard-template.js"></script>
  <script>
    (function () {
      "use strict";

      // Register standard-template with Bootstrap class names (no Bootstrap CSS needed)
      var stBundle = window.FormioStandardTemplate;
      if (stBundle && stBundle.standardTemplate && stBundle.BOOTSTRAP_EXAMPLE) {
        Formio.use(stBundle.standardTemplate("gryphon", stBundle.BOOTSTRAP_EXAMPLE));
      }

      var formInstance = null;
      var placeholderObserver = null;

      /**
       * Inject placeholder=" " on every .form-control that lacks one.
       * This is required for the CSS floating-label trick:
       * :has(.form-control:not(:placeholder-shown)) only fires when the
       * input has a placeholder attribute set (even a single space).
       */
      function injectPlaceholders() {
        var container = document.getElementById("formio-container");
        if (!container) return;
        container.querySelectorAll(".form-control").forEach(function (el) {
          if (!el.placeholder) el.placeholder = " ";
        });
      }

      /**
       * Opt datagrid children into rendering their own labels.
       * In stacked (vertical) layout each cell is full-width, so the shared
       * column-name header row is hidden and each field needs its own label.
       */
      function enableDataGridLabels(node) {
        if (!node || !node.components) return;
        var isDataGrid = node.type === "datagrid";
        node.components.forEach(function (child) {
          if (isDataGrid) child.dataGridLabel = true;
          enableDataGridLabels(child);
        });
      }

      function postMessage(type, payload) {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: type, payload: payload }));
        }
      }

      function postError(message, detail) {
        postMessage("FORM_ERROR", { message: message, detail: detail || null });
      }

      /**
       * Render a Form.io form from a JSON schema.
       * Optionally pre-fill with an existing submission.
       */
      window.loadForm = function loadForm(schema, submission) {
        var container = document.getElementById("formio-container");
        container.innerHTML = "";

        if (placeholderObserver) {
          placeholderObserver.disconnect();
          placeholderObserver = null;
        }
        if (formInstance) {
          formInstance.destroy();
          formInstance = null;
        }

        // Enable datagrid child labels for stacked layout
        enableDataGridLabels(schema);

        Formio.createForm(container, schema, {
          noAlerts: true,
          readOnly: false,
          renderMode: "form",
          sanitize: true,
          framework: "gryphon"
        })
          .then(function (form) {
            formInstance = form;

            if (submission) {
              form.submission = { data: submission };
            }

            form.on("change", function (changed) {
              try {
                var isValid = false;
                try { isValid = form.checkValidity(form.submission.data, false); } catch (_) {}
                postMessage("FORM_CHANGE", {
                  data: form.submission.data,
                  changed: changed ? changed.changed : null,
                  isValid: isValid
                });
              } catch (err) {
                postMessage("FORM_ERROR", { message: "change handler error", detail: String(err) });
              }
            });

            form.on("submit", function (sub) {
              postMessage("FORM_SUBMIT", { data: sub.data });
            });

            form.on("error", function (errors) {
              postMessage("FORM_VALIDATION_ERROR", {
                errors: Array.isArray(errors)
                  ? errors.map(function (e) { return e.message || String(e); })
                  : [String(errors)]
              });
            });

            // Inject placeholder=" " so CSS :not(:placeholder-shown) fires for floating labels
            injectPlaceholders();
            placeholderObserver = new MutationObserver(injectPlaceholders);
            placeholderObserver.observe(container, { childList: true, subtree: true });

            postMessage("FORM_READY", { components: schema.components ? schema.components.length : 0 });
          })
          .catch(function (err) {
            container.innerHTML =
              '<div class="formio-error-wrapper">Failed to load form: ' +
              (err.message || String(err)).replace(/[<>&"]/g, function (c) {
                return { "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c];
              }) +
              "</div>";
            postError("Failed to load form", err.message || String(err));
          });
      };

      /**
       * Return the current form submission data, or null if no form is loaded.
       */
      window.getSubmission = function getSubmission() {
        if (!formInstance) {
          return null;
        }
        return formInstance.submission.data;
      };

      /**
       * Listen for messages sent from React Native via injectJavaScript / postMessage.
       * Expected message format: { type: string, payload: any }
       */
      function handleMessage(event) {
        var msg;
        try {
          msg = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        } catch (_) {
          return;
        }

        if (!msg || !msg.type) return;

        switch (msg.type) {
          case "LOAD_FORM":
            window.loadForm(msg.payload.schema, msg.payload.submission || null);
            break;

          case "GET_SUBMISSION":
            postMessage("SUBMISSION_RESULT", { data: window.getSubmission() });
            break;

          case "SET_SUBMISSION":
            if (formInstance && msg.payload && msg.payload.data) {
              formInstance.submission = { data: msg.payload.data };
            }
            break;

          case "SET_READ_ONLY":
            if (formInstance) {
              formInstance.readOnly = !!msg.payload.readOnly;
              formInstance.redraw();
            }
            break;

          case "VALIDATE_FORM":
            if (formInstance) {
              var isValid = formInstance.checkValidity(formInstance.submission.data, true);
              var validationErrors = [];
              if (!isValid) {
                formInstance.errors.forEach(function (err) {
                  if (err.messages && Array.isArray(err.messages)) {
                    err.messages.forEach(function (m) {
                      validationErrors.push(m.message || String(m));
                    });
                  } else {
                    validationErrors.push(err.message || String(err));
                  }
                });
              }
              postMessage("FORM_VALIDATION_ERROR", { errors: validationErrors });
            }
            break;

          default:
            break;
        }
      }

      document.addEventListener("message", handleMessage);
      window.addEventListener("message", handleMessage);

      postMessage("SHELL_READY", null);
    })();
  </script>
</body>
</html>
